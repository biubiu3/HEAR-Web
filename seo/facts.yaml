# Videos are regenerated into /videos/<slug>/ pages and a video sitemap.
videos:
  - slug: moka-coffee
    title: "Moka Coffee"
    file: "moka_pot_all_web.mp4"
    poster: "moka-coffee.jpg"
    caption: "moka-coffee.en.vtt"
    duration: 42
    duration_iso: "PT42S"
    version: "54b44d6"
    date: "2026-07-27"
    what: "Long-horizon sound-centric process monitoring: the robot must detect the transition into the sputtering phase before pouring."
    why: "A traditional Moka pot offers almost no clean visual completion signal, so progress must be inferred from sound."
  - slug: answer-phone
    title: "Answer Phone"
    file: "telephone_all.mp4"
    poster: "answer-phone.jpg"
    caption: "answer-phone.en.vtt"
    duration: 41
    duration_iso: "PT41S"
    date: "2026-07-27"
    what: "Multi-stage progress tracking with ring detection, speech understanding and end-of-call recognition under severe visual aliasing."
    why: "The robot revisits nearly identical visual states at different semantic stages of the task."
  - slug: shake-bottle-empty
    title: "Shake Bottle (Empty)"
    file: "empty_all.mp4"
    poster: "shake-bottle-empty.jpg"
    caption: "shake-empty.en.vtt"
    duration: 32
    duration_iso: "PT32S"
    date: "2026-07-27"
    what: "Active acoustic sensing, where perception depends on generating a repeatable motion that elicits a discriminative sound."
    why: "The hidden state cannot be recovered passively; the robot must first create the evidence itself."
  - slug: shake-bottle-occupied
    title: "Shake Bottle (Occupied)"
    file: "occupied_all.mp4"
    poster: "shake-bottle-occupied.jpg"
    caption: "shake-occupied.en.vtt"
    duration: 32
    duration_iso: "PT32S"
    date: "2026-07-27"
    what: "Whether the policy can use self-generated rattling sound to distinguish occupied from empty bottles consistently across trials."
    why: "The companion case showing the same active sensing behaviour under a different hidden physical state."
  - slug: real-alarm-clock
    title: "Real Alarm Clock"
    file: "alarm_all.mp4"
    poster: "real-alarm-clock.jpg"
    caption: "real-alarm-clock.en.vtt"
    duration: 31
    duration_iso: "PT31S"
    date: "2026-07-27"
    what: "Whether the model remains sound-causal under real acoustic domain shift and still avoids the visually tempting early press."
    why: "The simulation alarm setting transferred into the physical world, where reverberation and background chatter distort the cue."
